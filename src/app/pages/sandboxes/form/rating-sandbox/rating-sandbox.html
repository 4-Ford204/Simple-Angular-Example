<app-sandbox #sandbox></app-sandbox>

<div class="flex flex-col gap-5">
  <ng-template #basic>
    <app-rating-component [iconOnStyle]="{ color: 'yellow' }" [(model)]="rate" />
  </ng-template>

  <ng-template #numberOfStars>
    <app-rating-component [stars]="10" [(model)]="rate" />
  </ng-template>

  <ng-template #readonly>
    <app-rating-component [readonly]="true" [(model)]="rate" />
  </ng-template>

  <ng-template #disabled>
    <app-rating-component [disabled]="true" [(model)]="rate" />
  </ng-template>

  @if (sandbox.panelTemplate) {
    <ng-container
      [ngTemplateOutlet]="sandbox.panelTemplate"
      [ngTemplateOutletContext]="{ title: 'Basic', content: basic }"
    ></ng-container>

    <ng-container
      [ngTemplateOutlet]="sandbox.panelTemplate"
      [ngTemplateOutletContext]="{ title: 'Number Of Stars', content: numberOfStars }"
    ></ng-container>

    <ng-container
      [ngTemplateOutlet]="sandbox.panelTemplate"
      [ngTemplateOutletContext]="{ title: 'ReadOnly', content: readonly }"
    ></ng-container>

    <ng-container
      [ngTemplateOutlet]="sandbox.panelTemplate"
      [ngTemplateOutletContext]="{ title: 'Disabled', content: disabled }"
    ></ng-container>
  }
</div>
