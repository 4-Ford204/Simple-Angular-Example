<app-sandbox #sandbox></app-sandbox>

<div class="flex flex-col gap-5">
  <ng-template #birthdays>
    <div #birthdayTimeline class="h-80 w-full">
      <app-timeline-component
        [pt]="{ event: { class: 'min-w-32' } }"
        [value]="users"
        align="top"
        layout="horizontal"
        class="h-full w-full"
      />
    </div>
  </ng-template>

  <ng-template #template>
    <app-timeline-component [value]="events" />
  </ng-template>

  @if (sandbox.panelTemplate) {
    <ng-container
      [ngTemplateOutlet]="sandbox.panelTemplate"
      [ngTemplateOutletContext]="{ title: 'Birthdays', content: birthdays }"
    ></ng-container>

    <ng-container
      [ngTemplateOutlet]="sandbox.panelTemplate"
      [ngTemplateOutletContext]="{ title: 'Template', content: template }"
    ></ng-container>
  }
</div>
