<div class="flex h-full w-full items-center justify-center">
  <div></div>

  <div class="flex flex-col gap-5">
    <p-floatlabel variant="on">
      <input id="username" pInputText [(ngModel)]="username" autocomplete="off" />
      <label for="username">Username</label>
    </p-floatlabel>

    <p-floatlabel variant="on">
      <p-password inputId="password" [(ngModel)]="password" [toggleMask]="true" />
      <label for="password">Password</label>
    </p-floatlabel>

    <div>
      <app-button-component title="Sign In" />
    </div>

    <div>
      <app-button-component [icon]="PrimeIcons.GOOGLE" />
      <app-button-component [icon]="PrimeIcons.FACEBOOK" />
      <app-button-component [icon]="PrimeIcons.MICROSOFT" />
    </div>
  </div>
</div>
