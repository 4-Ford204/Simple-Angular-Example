<app-toast-component />

<div class="flex h-screen items-center justify-center">
  <div class="rounded-2xl border p-5">
    <div></div>

    <div class="flex flex-col gap-5">
      <form class="flex flex-col gap-5" (ngSubmit)="onSignInButtonPressed()">
        <app-float-label-input-component
          variant="on"
          label="Username"
          [fluid]="true"
          [(model)]="username"
        />

        <app-float-label-password-component
          variant="on"
          [fluid]="true"
          [feedback]="false"
          [toggleMask]="true"
          [(model)]="password"
        />

        <div>
          <app-button-component type="submit" label="Sign In" styleClass="w-full" />
        </div>
      </form>

      <div class="flex justify-center gap-5">
        <app-button-component [icon]="PrimeIcons.GOOGLE" [rounded]="true" />
        <app-button-component [icon]="PrimeIcons.FACEBOOK" [rounded]="true" />
        <app-button-component [icon]="PrimeIcons.MICROSOFT" [rounded]="true" />
      </div>
    </div>
  </div>
</div>
