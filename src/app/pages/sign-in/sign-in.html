<div class="flex h-screen items-center justify-center">
  <div class="rounded-2xl border p-5">
    <div></div>

    <div class="flex flex-col gap-5">
      <p-floatlabel variant="on">
        <input id="username" pInputText [(ngModel)]="username" autocomplete="off" fluid />
        <label for="username">Username</label>
      </p-floatlabel>

      <p-floatlabel variant="on">
        <p-password
          inputId="password"
          [feedback]="false"
          [toggleMask]="true"
          [(ngModel)]="password"
        />
        <label for="password">Password</label>
      </p-floatlabel>

      <span class="text-red-700">{{ error }}</span>

      <div>
        <app-button-component label="Sign In" (buttonPressed)="onSignInButtonPressed()" />
      </div>

      <div class="flex justify-center gap-5">
        <app-button-component [icon]="PrimeIcons.GOOGLE" [rounded]="true" />
        <app-button-component [icon]="PrimeIcons.FACEBOOK" [rounded]="true" />
        <app-button-component [icon]="PrimeIcons.MICROSOFT" [rounded]="true" />
      </div>
    </div>
  </div>
</div>
