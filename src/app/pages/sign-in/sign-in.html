<div class="flex h-full w-full items-center justify-center">
  <div></div>

  <div class="flex flex-col gap-5">
    <p-floatlabel variant="on">
      <input id="username" pInputText [(ngModel)]="username" autocomplete="off" class="w-full" />
      <label for="username">Username</label>
    </p-floatlabel>

    <p-floatlabel variant="on">
      <p-password inputId="password" [(ngModel)]="password" [toggleMask]="true" />
      <label for="password">Password</label>
    </p-floatlabel>

    <div>
      <app-button-component label="Sign In" (buttonPressed)="onSignInButtonPressed()" />
    </div>

    <div class="flex justify-center gap-5">
      <app-button-component [icon]="PrimeIcons.GOOGLE" [rounded]="true" />
      <app-button-component [icon]="PrimeIcons.FACEBOOK" [rounded]="true" />
      <app-button-component [icon]="PrimeIcons.MICROSOFT" [rounded]="true" />
    </div>
  </div>
</div>
